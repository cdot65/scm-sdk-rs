[package]
name = "scm-sdk"
version = "0.1.0"
description = "Native async Strata Cloud Manager SDK, beginning with Prisma AIRS"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"
include = ["src/**", "examples/**", "LICENSE", "NOTICE", "README.md"]
keywords = ["prisma-airs", "strata", "palo-alto", "security", "sdk"]
categories = ["api-bindings", "asynchronous"]

[features]
default = ["reqwest-transport", "scan"]
reqwest-transport = ["dep:reqwest"]
models = []
scan = ["models"]
management = ["models", "dlp"]
dlp = ["models"]
iam = ["models", "dep:getrandom"]
gateway = ["models", "iam"]
agentguard = ["models"]
realtime = ["gateway"]
ws-transport = ["realtime", "dep:tokio-websockets", "dep:rustls", "dep:tokio-rustls", "dep:rustls-native-certs", "dep:httparse", "dep:aws-lc-rs", "tokio/net"]
model-security = ["models"]
red-team = ["models"]

[dependencies]
base64 = "0.22.1"
bytes = "1.11"
futures-util = { version = "0.3.34", features = ["sink"] }
getrandom = { version = "0.4.3", optional = true }
hmac = "0.12.1"
http = "1.4"
httpdate = "1.0.3"
mime = "0.3.17"
regex = "1.13.1"
ryu-js = "1.0.3"
reqwest = { version = "0.13.5", optional = true, default-features = false, features = ["rustls", "http2", "stream", "gzip", "system-proxy"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
tokio = { version = "1.50", features = ["sync", "time", "macros", "rt", "fs", "io-util"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
time = { version = "0.3.55", features = ["parsing", "formatting"] }
url = "2.5.8"
zeroize = "1.8.2"
aws-lc-rs = { version = "1.18.2", optional = true, default-features = false, features = ["aws-lc-sys"] }
httparse = { version = "1.10.1", optional = true }
rustls = { version = "0.23.46", optional = true, default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-native-certs = { version = "0.8.5", optional = true }
tokio-rustls = { version = "0.26.6", optional = true, default-features = false, features = ["aws_lc_rs", "tls12"] }
tokio-websockets = { version = "=0.13.3", optional = true, default-features = false, features = ["client", "getrandom", "aws_lc_rs"] }

[dev-dependencies]
flate2 = "1.1"
tokio = { version = "1.50", features = ["sync", "time", "macros", "rt-multi-thread", "net", "io-util", "test-util"] }

[lints]
workspace = true

