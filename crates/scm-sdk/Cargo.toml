[package]
name = "scm-sdk"
version = "0.1.0"
description = "Native async Strata Cloud Manager SDK, beginning with Prisma AIRS"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"
include = ["src/**", "examples/**", "LICENSE", "NOTICE", "README.md"]
keywords = ["prisma-airs", "strata", "palo-alto", "security", "sdk"]
categories = ["api-bindings", "asynchronous"]

[features]
default = ["reqwest-transport"]
reqwest-transport = ["dep:reqwest"]

[dependencies]
base64 = "0.22.1"
bytes = "1.11"
futures-util = "0.3.34"
hmac = "0.12.1"
http = "1.4"
httpdate = "1.0.3"
mime = "0.3.17"
reqwest = { version = "0.13.5", optional = true, default-features = false, features = ["rustls", "http2", "stream", "gzip", "system-proxy"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
tokio = { version = "1.50", features = ["sync", "time", "macros", "rt"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
url = "2.5.8"
zeroize = "1.8.2"

[dev-dependencies]
flate2 = "1.1"
tokio = { version = "1.50", features = ["sync", "time", "macros", "rt-multi-thread", "net", "io-util", "test-util"] }

[lints]
workspace = true

