name: Credential-free SDK qualification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  RUSTDOCFLAGS: -D warnings
  CI_UV_VERSION: "0.13.1"

jobs:
  # Legacy job name: clean archive execution is a local release gate; this job runs contracts only.
  contracts-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out the reviewed source
        uses: https://github.com/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1, Node 20
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned development-only Node
        uses: https://github.com/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.2"
      - name: Bootstrap rustup and install the reviewed minimum Rust compiler
        uses: https://github.com/dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # reviewed untagged master commit, 2026-10-17
        with:
          toolchain: "1.89.0"
          components: rustfmt,clippy
      - name: Install the reviewed current Rust compiler
        uses: https://github.com/dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # reviewed untagged master commit, 2026-10-17
        with:
          toolchain: "1.99.0"
          components: rustfmt,clippy
      - name: Select reviewed uv digests and a fresh tool cache
        id: uv-integrity
        shell: bash
        run: node scripts/uv-integrity.cjs select
      - name: Install pinned development-only uv
        id: setup-uv
        env:
          RUNNER_TOOL_CACHE: ${{ steps.uv-integrity.outputs.tool-cache }}
        uses: https://github.com/astral-sh/setup-uv@4959332f0f014c5280e7eac8b70c90cb574c9f9b # v6.6.0, Node 20
        with:
          version: ${{ env.CI_UV_VERSION }}
          checksum: ${{ steps.uv-integrity.outputs.checksum }}
          enable-cache: false
          github-token: ""
      - name: Bootstrap pinned portable Python
        shell: bash
        env:
          SCM_SDK_UV_EXECUTABLE: ${{ steps.setup-uv.outputs.uv-path }}
          UV_PYTHON_INSTALL_DIR: ${{ runner.temp }}/scm-sdk-python
          UV_PYTHON_BIN_DIR: ${{ runner.temp }}/scm-sdk-python-bin
        run: bash scripts/bootstrap-python.sh
      - name: Install exact dependency-policy tools
        run: |
          cargo +1.99.0 install cargo-audit --locked --version 0.22.2
          cargo +1.99.0 install cargo-deny --locked --version 0.20.2
      - name: Prepare locked dependency inputs for the policy audit
        run: |
          cargo +1.99.0 fetch --locked
          cargo +1.99.0 metadata --all-features --locked --offline --format-version 1 > /dev/null
      - name: Restore verified frozen development sources and locked npm tooling
        run: python3 tools/bootstrap_reference.py
      - name: Verify current vendor and frozen contracts
        run: python3 tools/check_phase.py --phase 28 --verification-only --contracts-only
      - name: Record the source-bound qualification receipt in the job log
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib
          path = pathlib.Path("docs/checks/phase-28-contracts.json")
          report = json.loads(path.read_text())
          print(json.dumps({key: report[key] for key in ("phase", "source_sha256", "source_unchanged", "passed")}))
          print(json.dumps({"report_sha256": hashlib.sha256(path.read_bytes()).hexdigest(), "commands": len(report["checks"])}))
          PY

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.89.0", "1.99.0"]
        features: ["default", "minimal", "all", "json-unification", "red-team-json-unification", "gateway-json-unification", "models", "reqwest-transport", "scan", "management", "dlp", "iam", "model-security", "red-team", "gateway", "agentguard", "realtime", "ws-transport", "tracing", "default-tracing", "realtime-tracing", "ws-tracing", "native-probes", "probe-base"]
    steps:
      - name: Check out the reviewed source
        uses: https://github.com/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1, Node 20
        with:
          persist-credentials: false
      - name: Install pinned development-only Node
        uses: https://github.com/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.2"
      - name: Bootstrap rustup and install the exact Rust toolchain
        uses: https://github.com/dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # reviewed untagged master commit, 2026-10-17
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt,clippy
      - name: Select reviewed uv digests and a fresh tool cache
        id: uv-integrity
        shell: bash
        run: node scripts/uv-integrity.cjs select
      - name: Install pinned development-only uv
        id: setup-uv
        env:
          RUNNER_TOOL_CACHE: ${{ steps.uv-integrity.outputs.tool-cache }}
        uses: https://github.com/astral-sh/setup-uv@4959332f0f014c5280e7eac8b70c90cb574c9f9b # v6.6.0, Node 20
        with:
          version: ${{ env.CI_UV_VERSION }}
          checksum: ${{ steps.uv-integrity.outputs.checksum }}
          enable-cache: false
          github-token: ""
      - name: Bootstrap pinned portable Python
        shell: bash
        env:
          SCM_SDK_UV_EXECUTABLE: ${{ steps.setup-uv.outputs.uv-path }}
          UV_PYTHON_INSTALL_DIR: ${{ runner.temp }}/scm-sdk-python
          UV_PYTHON_BIN_DIR: ${{ runner.temp }}/scm-sdk-python-bin
        run: bash scripts/bootstrap-python.sh
      - name: Check formatting, build, Clippy, tests, and documentation
        run: python3 scripts/check-rust.py --toolchain ${{ matrix.toolchain }} --feature-set ${{ matrix.features }}
