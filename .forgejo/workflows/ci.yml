name: Credential-free SDK qualification

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      native_platforms:
        description: Run native platforms only after these runner labels are registered
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  RUSTDOCFLAGS: -D warnings

jobs:
  contracts-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out the reviewed source
        uses: https://github.com/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1, Node 20
        with:
          persist-credentials: false
      - name: Install pinned development-only Node
        uses: https://github.com/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.2"
      - name: Install reviewed Rust compilers
        run: |
          rustup toolchain install 1.89.0 --profile minimal --component rustfmt,clippy --no-self-update
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt,clippy --no-self-update
      - name: Install exact dependency-policy tools
        run: |
          cargo +1.99.0 install cargo-audit --locked --version 0.22.2
          cargo +1.99.0 install cargo-deny --locked --version 0.20.2
      - name: Prepare compile-only standard libraries and locked dependency inputs
        run: |
          rustup target add --toolchain 1.99.0 x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu aarch64-apple-darwin x86_64-pc-windows-msvc
          cargo +1.99.0 fetch --locked --target x86_64-unknown-linux-gnu
          cargo +1.99.0 fetch --locked --target aarch64-unknown-linux-gnu
          cargo +1.99.0 fetch --locked --target aarch64-apple-darwin
          cargo +1.99.0 fetch --locked --target x86_64-pc-windows-msvc
      - name: Restore verified frozen development sources and locked npm tooling
        run: python3 tools/bootstrap_reference.py
      - name: Qualify contracts, generation, security, native probes, and packaged consumers
        run: python3 tools/check_phase.py --phase 8 --verification-only
      - name: Record the source-bound qualification receipt in the job log
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib
          path = pathlib.Path("docs/checks/phase-08.json")
          report = json.loads(path.read_text())
          print(json.dumps({key: report[key] for key in ("phase", "source_sha256", "source_unchanged", "passed")}))
          print(json.dumps({"report_sha256": hashlib.sha256(path.read_bytes()).hexdigest(), "commands": len(report["checks"])}))
          PY

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.89.0", "1.99.0"]
        features: ["default", "minimal", "all", "json-unification", "gateway-json-unification", "models", "reqwest-transport", "scan", "management", "dlp", "iam", "model-security", "red-team", "gateway", "agentguard", "realtime", "ws-transport", "tracing", "default-tracing", "realtime-tracing", "ws-tracing", "native-probes", "probe-base"]
    steps:
      - name: Check out the reviewed source
        uses: https://github.com/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1, Node 20
        with:
          persist-credentials: false
      - name: Install the exact Rust toolchain
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component rustfmt,clippy --no-self-update
      - name: Check formatting, build, Clippy, tests, and documentation
        run: python3 scripts/check-rust.py --toolchain ${{ matrix.toolchain }} --feature-set ${{ matrix.features }}

  additional-native-platforms:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.native_platforms == true }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: linux-arm64
            target: aarch64-unknown-linux-gnu
            python: python3
          - runner: macos-arm64
            target: aarch64-apple-darwin
            python: python3
          - runner: windows-amd64
            target: x86_64-pc-windows-msvc
            python: python
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out the reviewed source
        uses: https://github.com/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1, Node 20
        with:
          persist-credentials: false
      - name: Install the exact Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt,clippy --no-self-update
      - name: Verify the registered native runner target
        run: |
          ${{ matrix.python }} -c "import subprocess; assert 'host: ${{ matrix.target }}' in subprocess.check_output(['rustc', '+1.99.0', '-vV'], text=True)"
      - name: Run native checks and tests
        run: ${{ matrix.python }} scripts/check-rust.py --toolchain 1.99.0 --feature-set all
