[workspace]
members = ["crates/scm-sdk"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://git.cdot.io/cdot/scm-sdk-rs"
authors = ["Calvin Remsburg"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"

